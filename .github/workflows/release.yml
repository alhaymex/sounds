name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: sounds
            archive: tar.gz
            install_deps: true

          - name: windows-x86_64
            os: windows-latest
            binary: sounds.exe
            archive: zip
            install_deps: false

          - name: macos-arm64
            os: macos-latest
            binary: sounds
            archive: tar.gz
            install_deps: false

          - name: macos-x86_64
            os: macos-15-intel
            binary: sounds
            archive: tar.gz
            install_deps: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install linux dependencies
        if: ${{ matrix.target.install_deps }}
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.target.binary }} dist/${{ matrix.target.binary }}

      - name: Package tar.gz
        if: ${{ matrix.target.archive == 'tar.gz' }}
        shell: bash
        run: |
          tar -czf dist/sounds-${{ github.ref_name }}-${{ matrix.target.name }}.tar.gz \
            -C dist ${{ matrix.target.binary }}

      - name: Package zip
        if: ${{ matrix.target.archive == 'zip' }}
        shell: bash
        run: |
          cd dist
          7z a sounds-${{ github.ref_name }}-${{ matrix.target.name }}.zip ${{ matrix.target.binary }}

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum &> /dev/null; then
            sha256sum sounds-${{ github.ref_name }}-${{ matrix.target.name }}.${{ matrix.target.archive }} \
              > SHA256SUMS-${{ matrix.target.name }}
          else
            shasum -a 256 sounds-${{ github.ref_name }}-${{ matrix.target.name }}.${{ matrix.target.archive }} \
              > SHA256SUMS-${{ matrix.target.name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: |
            dist/sounds-${{ github.ref_name }}-${{ matrix.target.name }}.${{ matrix.target.archive }}
            dist/SHA256SUMS-${{ matrix.target.name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate checksums
        run: |
          find artifacts -name 'SHA256SUMS-*' -exec cat {} + > artifacts/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/**/*
